repos:
  - repo: https://github.com/tofuutils/pre-commit-opentofu
    rev: v2.2.0
    hooks:
      - id: tofu_fmt
      - id: tofu_checkov
      - id: tofu_tflint
      - id: tofu_trivy
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--exclude=SC2154,SC2181"]
